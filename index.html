<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生日快樂！</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      max-width: 600px;
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }
    /* 打字顯示區域 */
    .typing-text {
      font-size: 1.25rem;
      line-height: 1.8;
      letter-spacing: 2px;
      min-height: 120px;
      text-align: left;
      white-space: pre-wrap;
    }
    /* 光標閃爍效果 */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background-color: #38bdf8;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    /* 按鈕樣式 */
    .next-btn {
      margin-top: 30px;
      padding: 12px 28px;
      font-size: 1rem;
      color: #fff;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      opacity: 0; /* 預設隱藏，字打完才出現 */
      transform: translateY(10px);
      transition: all 0.5s ease;
    }
    .next-btn.show {
      opacity: 1;
      transform: translateY(0);
    }
    .next-btn:hover {
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="typing-text"><span id="text"></span><span class="cursor"></span></div>
    <button id="btn" class="next-btn" onclick="nextStage()">準備好了，出發！</button>
  </div>

  <script>
    // 這裡替換你想講的故事與文字段落
    const story = [
      "這不是一個普通的生日網站，\n是我為你準備的一段旅程。",
      "在過去這一年裡，我們一起經歷了很多時刻……",
      "有笑過、有累過，但幸好都有你在。",
      "今天，換我為你準備一個小驚喜。"
    ];

    let currentStage = 0;
    let charIndex = 0;
    const speed = 100; // 打字速度（毫秒/字）
    const textElement = document.getElementById("text");
    const btnElement = document.getElementById("btn");

    function typeWriter() {
      if (charIndex < story[currentStage].length) {
        textElement.textContent += story[currentStage].charAt(charIndex);
        charIndex++;
        setTimeout(typeWriter, speed);
      } else {
        // 當前段落打字完成，顯示按鈕
        btnElement.classList.add("show");
      }
    }

    function nextStage() {
      currentStage++;
      if (currentStage < story.length) {
        // 重置文字與按鈕狀態，進入下一段
        textElement.textContent = "";
        charIndex = 0;
        btnElement.classList.remove("show");
        
        // 如果是最後段落，更換按鈕文字
        if (currentStage === story.length - 1) {
          btnElement.textContent = "開啟生日驚喜 🎉";
        } else {
          btnElement.textContent = "繼續往下滑";
        }
        
        typeWriter();
      } else {
        // 旅程結束後的跳轉頁面或出現驚喜卡片
        alert("🎉 生日快樂！祝你有個完美的一天！");
      }
    }

    // 頁面載入後自動開始打字
    window.onload = typeWriter;
  </script>

</body>
</html>
